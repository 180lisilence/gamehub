<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2048</title>
<style>
  body { background:#000; color:#33ff33; font-family:monospace; display:flex; flex-direction:column; align-items:center; padding:20px; margin:0; }
  h1 { margin:0 0 10px; }
  #board { display:grid; grid-template-columns:repeat(4,80px); grid-template-rows:repeat(4,80px); gap:6px; background:#111; padding:6px; border:2px solid #33ff33; }
  .cell { display:flex; align-items:center; justify-content:center; font-size:24px; background:#1a1a1a; font-weight:bold; }
  .v2 { background:#1a3a1a; } .v4 { background:#1a5a1a; } .v8 { background:#2a8a2a; color:#fff; }
  .v16 { background:#3aaa3a; color:#fff; } .v32 { background:#4aca4a; color:#fff; }
  .v64 { background:#6aea6a; color:#000; } .v128 { background:#ffb000; color:#000; }
  .v256 { background:#ffcc33; color:#000; } .v512 { background:#ffdd55; color:#000; }
  .v1024 { background:#ffee88; color:#000; font-size:18px; } .v2048 { background:#ffff00; color:#000; font-size:18px; }
  #score { margin:10px 0; font-size:18px; }
  #msg { color:#ffb000; min-height:24px; }
  button { background:transparent; color:#33ff33; border:1px solid #33ff33; padding:6px 16px; font-family:monospace; cursor:pointer; margin-top:10px; }
  button:hover { background:#33ff33; color:#000; }
</style>
</head>
<body>
  <h1>2048</h1>
  <div id="score">SCORE: 0</div>
  <div id="board"></div>
  <div id="msg"></div>
  <button onclick="init()">RESET</button>
<script>
let grid, score;
const size = 4;
const board = document.getElementById('board');
const scoreEl = document.getElementById('score');
const msgEl = document.getElementById('msg');

function init() {
  grid = Array.from({length: size}, () => Array(size).fill(0));
  score = 0;
  addRandom(); addRandom();
  render();
  msgEl.textContent = '';
}
function addRandom() {
  const empty = [];
  for (let i=0;i<size;i++) for (let j=0;j<size;j++) if (!grid[i][j]) empty.push([i,j]);
  if (!empty.length) return;
  const [r,c] = empty[Math.floor(Math.random()*empty.length)];
  grid[r][c] = Math.random() < 0.9 ? 2 : 4;
}
function render() {
  board.innerHTML = '';
  for (let i=0;i<size;i++) for (let j=0;j<size;j++) {
    const v = grid[i][j];
    const d = document.createElement('div');
    d.className = 'cell' + (v ? ' v'+v : '');
    d.textContent = v || '';
    board.appendChild(d);
  }
  scoreEl.textContent = 'SCORE: ' + score;
}
function slide(row) {
  let arr = row.filter(v => v);
  for (let i=0;i<arr.length-1;i++) {
    if (arr[i] === arr[i+1]) { arr[i]*=2; score+=arr[i]; arr[i+1]=0; }
  }
  arr = arr.filter(v => v);
  while (arr.length < size) arr.push(0);
  return arr;
}
function move(dir) {
  let moved = false;
  if (dir==='left'||dir==='right') {
    for (let i=0;i<size;i++) {
      let row = [...grid[i]];
      if (dir==='right') row.reverse();
      row = slide(row);
      if (dir==='right') row.reverse();
      if (row.join() !== grid[i].join()) moved = true;
      grid[i] = row;
    }
  } else {
    for (let j=0;j<size;j++) {
      let col = grid.map(r => r[j]);
      if (dir==='down') col.reverse();
      col = slide(col);
      if (dir==='down') col.reverse();
      for (let i=0;i<size;i++) {
        if (grid[i][j] !== col[i]) moved = true;
        grid[i][j] = col[i];
      }
    }
  }
  if (moved) { addRandom(); render(); check(); }
}
function check() {
  for (let i=0;i<size;i++) for (let j=0;j<size;j++) {
    if (grid[i][j] === 2048) { msgEl.textContent = 'YOU WIN!'; return; }
  }
  for (let i=0;i<size;i++) for (let j=0;j<size;j++) {
    if (!grid[i][j]) return;
    if (j<size-1 && grid[i][j]===grid[i][j+1]) return;
    if (i<size-1 && grid[i][j]===grid[i+1][j]) return;
  }
  msgEl.textContent = 'GAME OVER';
}
document.addEventListener('keydown', e => {
  const map = {ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down'};
  if (map[e.key]) { e.preventDefault(); move(map[e.key]); }
});
init();
</script>
</body>
</html>
