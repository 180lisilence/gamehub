<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>贪吃蛇</title>
<style>
  body { background:#000; color:#33ff33; font-family:monospace; display:flex; flex-direction:column; align-items:center; padding:20px; margin:0; }
  h1 { margin:0 0 10px; }
  #score { font-size:18px; margin-bottom:10px; }
  canvas { border:2px solid #33ff33; background:#0a0a0a; }
  #msg { color:#ffb000; min-height:24px; margin-top:10px; }
  button { background:transparent; color:#33ff33; border:1px solid #33ff33; padding:6px 16px; font-family:monospace; cursor:pointer; margin-top:10px; }
  button:hover { background:#33ff33; color:#000; }
</style>
</head>
<body>
  <h1>贪吃蛇</h1>
  <div id="score">SCORE: 0</div>
  <canvas id="cv" width="400" height="400"></canvas>
  <div id="msg">方向键控制</div>
  <button onclick="start()">RESET</button>
<script>
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const S = 20; // 每格像素
const N = 20; // 20x20 格
let snake, dir, food, score, timer;

function start() {
  snake = [{x:10,y:10},{x:9,y:10},{x:8,y:10}];
  dir = {x:1,y:0};
  score = 0;
  placeFood();
  document.getElementById('msg').textContent = '';
  clearInterval(timer);
  timer = setInterval(tick, 120);
  draw();
}
function placeFood() {
  while (true) {
    food = {x: Math.floor(Math.random()*N), y: Math.floor(Math.random()*N)};
    if (!snake.some(s => s.x===food.x && s.y===food.y)) return;
  }
}
function tick() {
  const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};
  // 撞墙
  if (head.x < 0 || head.x >= N || head.y < 0 || head.y >= N) return gameOver();
  // 撞自己
  if (snake.some(s => s.x===head.x && s.y===head.y)) return gameOver();
  snake.unshift(head);
  if (head.x===food.x && head.y===food.y) {
    score += 10;
    document.getElementById('score').textContent = 'SCORE: ' + score;
    placeFood();
  } else {
    snake.pop();
  }
  draw();
}
function draw() {
  ctx.fillStyle = '#0a0a0a';
  ctx.fillRect(0,0,cv.width,cv.height);
  // 食物
  ctx.fillStyle = '#ffb000';
  ctx.fillRect(food.x*S, food.y*S, S-1, S-1);
  // 蛇
  snake.forEach((s,i) => {
    ctx.fillStyle = i===0 ? '#aaffaa' : '#33ff33';
    ctx.fillRect(s.x*S, s.y*S, S-1, S-1);
  });
}
function gameOver() {
  clearInterval(timer);
  document.getElementById('msg').textContent = 'GAME OVER! SCORE: ' + score;
}
document.addEventListener('keydown', e => {
  const map = {ArrowUp:{x:0,y:-1},ArrowDown:{x:0,y:1},ArrowLeft:{x:-1,y:0},ArrowRight:{x:1,y:0}};
  const d = map[e.key];
  if (!d) return;
  e.preventDefault();
  // 禁止直接反向
  if (d.x === -dir.x && d.y === -dir.y) return;
  dir = d;
});
start();
</script>
</body>
</html>
